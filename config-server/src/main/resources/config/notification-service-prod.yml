spring:
  application:
    name: notification-service
  main:
    web-application-type: reactive
  cloud:

    bus:
      enabled: false

    function:
      definition: accountEventConsumer;transactionInitConsumer;transactionRefundConsumer;transactionCompleteConsumer;otpEventConsumer
    stream:
      kafka:
        binder:
          brokers: ${SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS:localhost:9092}
          auto-add-partitions: true
          auto-alter-topics: true
          auto-create-topics: true
        bindings:
          accountEventConsumer-in-0:
            consumer:
              ack-mode: MANUAL
          transactionInitConsumer-in-0:
            consumer:
              ack-mode: MANUAL
          transactionRefundConsumer-in-0:
            consumer:
              ack-mode: MANUAL
          transactionCompleteConsumer-in-0:
            consumer:
              ack-mode: MANUAL
          otpEventConsumer-in-0:
            consumer:
              ack-mode: MANUAL
      bindings:
        otpEventConsumer-in-0:
          destination: otp-generation-event
          group: notification-service-group
        transactionInitConsumer-in-0:
          destination: transactioninitiated
          group: notification-service-group
        transactionRefundConsumer-in-0:
          destination: transactionrefunded
          group: notification-service-group
        transactionCompleteConsumer-in-0:
          destination: transactioncompleted
          group: notification-service-group
        accountEventConsumer-in-0:
          destination: account
          group: notification-service-group
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

eureka:
  client:
    fetch-registry: false
    register-with-eureka: true
    refresh:
      enable: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

server:
  port: 8083

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"


logging:
  level:
    org.apache.kafka: ERROR
    org.apache.kafka.clients.consumer: ERROR
    org.springframework.cloud.stream.binder.kafka: WARN
    org.springframework.kafka: WARN