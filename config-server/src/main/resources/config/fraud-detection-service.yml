spring:
  application:
    name: fraud-detection-service
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  cloud:
    function:
      definition: transactionInitConsumer;cleanTransactionProducer;verifyTransactionProducer
    config:
      enabled: true

      discovery:
        enabled: true
        service-id: CONFIG-SERVER
    bus:
      enabled: false

    stream:
      kafka:
        binder:
          brokers: ${SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS:localhost:9092}
          auto-create-topics: true
          auto-alter-topics: true
          auto-add-partitions: true
        bindings:
          verifyTransactionProducer-out-0:
            producer:
              configuration:
                retries: 2
                acks: all
                enable.idempotence: true
          cleanTransactionProducer-out-0:
            producer:
              configuration:
                retries: 2
                acks: all
                enable.idempotence: true
          transactionInitConsumer-in-0:
            consumer:
              ack-mode: MANUAL
      bindings:
        verifyTransactionProducer-out-0:
          destination: verify-transaction
          producer:
            partition-key-expression: headers['partitionId']
        cleanTransactionProducer-out-0:
          destination: fraud-check-clean
          producer:
            partition-key-expression: headers['partitionId']
        transactionInitConsumer-in-0:
          destination: transactioninitiated
          group: fraud-detection-service-group
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

server:
  port: 8085

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
info:
  app:
    name: "fraud-detection-service"
    description: "Fraud Detection Service"
    version: "1.0"
    developed-by: 'yours-truly'

logging:
  level:
    org.apache.kafka: ERROR
    org.apache.kafka.clients.consumer: ERROR
    org.springframework.cloud.stream.binder.kafka: WARN
    org.springframework.kafka: WARN