<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Emblem Shield Group (X: 30, Y: 20, W: 160, H: 160) -->
  <g transform="translate(30, 20)">
    <rect width="160" height="160" rx="36" fill="url(#bgGrad)"/>
    <path d="M80 22 L124 44 V80 C124 112 104 136 80 146 C56 136 36 112 36 80 V44 Z" fill="none" stroke="url(#glowGrad)" stroke-width="4" opacity="0.4" filter="url(#glow)"/>
    <path d="M80 28 L118 48 V80 C118 108 100 130 80 138 C60 130 42 108 42 80 V48 Z" fill="url(#shieldGrad)"/>
    <path d="M80 38 L110 54 V80 C110 102 96 120 80 126 C64 120 50 102 50 80 V54 Z" fill="#0F172A" opacity="0.9"/>
    <path d="M80 54 L100 94 H89 L80 74 L71 94 H60 Z" fill="url(#glowGrad)"/>
    <circle cx="80" cy="88" r="7" fill="#06B6D4" filter="url(#glow)"/>
    <circle cx="80" cy="88" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography -->
  <text x="220" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52" letter-spacing="4" fill="url(#textGrad)">AVALON</text>
  <text x="222" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="22" letter-spacing="8" fill="#38BDF8">BANKING &amp; SECURITY</text>
</svg>
