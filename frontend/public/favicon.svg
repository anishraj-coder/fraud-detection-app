<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield Container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Shield Aura -->
  <path d="M256 72 L392 136 V248 C392 344 332 418 256 448 C180 418 120 344 120 248 V136 Z" 
        fill="none" stroke="url(#glowGrad)" stroke-width="12" opacity="0.4" filter="url(#glow)"/>

  <!-- Main Shield Body -->
  <path d="M256 90 L376 148 V248 C376 332 322 398 256 426 C190 398 136 332 136 248 V148 Z" 
        fill="url(#shieldGrad)"/>

  <!-- Inner Dark Core Layer -->
  <path d="M256 120 L352 166 V248 C352 316 308 370 256 394 C204 370 160 316 160 248 V166 Z" 
        fill="#0F172A" opacity="0.9"/>

  <!-- Bank Apex Crest / Stylized 'A' & Security Node -->
  <path d="M256 170 L318 290 H284 L256 230 L228 290 H194 Z" fill="url(#glowGrad)"/>
  
  <!-- Glowing Security Lock / Vault Diamond Core -->
  <circle cx="256" cy="275" r="22" fill="#06B6D4" filter="url(#glow)"/>
  <circle cx="256" cy="275" r="12" fill="#FFFFFF"/>
</svg>
