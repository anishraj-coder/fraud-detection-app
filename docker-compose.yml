services:
  # ==========================================
  # 1. INFRASTRUCTURE & AUTH (TUNED FOR 2GB VPS)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: postgres-dev
    restart: unless-stopped
    command: [ "postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50", "-c", "work_mem=4MB" ]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: accounts
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d accounts" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    deploy:
      resources:
        limits:
          memory: 200M

  redis:
    image: redis:alpine
    container_name: redis-dev
    restart: unless-stopped
    command: [ "redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru" ]
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 64M

  kafka:
    image: apache/kafka:latest
    container_name: kafka-dev
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-dev:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-dev:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Disable log cleaner to prevent SkimpyOffsetMap OOM on low-memory VPS
      KAFKA_LOG_CLEANER_ENABLE: "false"
      KAFKA_LOG_CLEANUP_POLICY: "delete"
      KAFKA_LOG_RETENTION_MS: "3600000"
      KAFKA_JVM_PERFORMANCE_OPTS: "-Xmx192m -Xms164m -XX:+UseG1GC"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    volumes:
      - kafka_data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 320M

  casdoor:
    image: casbin/casdoor-all-in-one:latest
    container_name: casdoor-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      driver: "sqlite3"
      dataSourceName: "/data/casdoor.db"
      dbName: "casdoor"
    volumes:
      - casdoor_data:/data
    deploy:
      resources:
        limits:
          memory: 192M

  # ==========================================
  # 2. EUREKA SERVER (JAR)
  # ==========================================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: eureka-server
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      JAVA_OPTS: "-Xms80m -Xmx110m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      EUREKA_SERVER_WAIT_TIME_IN_MS_WHEN_SYNC_EMPTY: "0"
      EUREKA_SERVER_RESPONSE_CACHE_UPDATE_INTERVAL_MS: "3000"
      EUREKA_SERVER_EVICTION_INTERVAL_TIMER_IN_MS: "5000"
    env_file:
      - path: ./eureka-server/.env
        required: false
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8761/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 160M

  # ==========================================
  # 3. CONFIG SERVER (JAR)
  # ==========================================
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      JAVA_OPTS: "-Xms80m -Xmx110m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: native
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "5"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
    env_file:
      - path: ./config-server/.env
        required: false
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8888/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      eureka-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 160M

  # ==========================================
  # 4. API GATEWAY SERVICE (JAR)
  # ==========================================
  api-gateway-service:
    build:
      context: ./api-gateway-service
      dockerfile: Dockerfile
    container_name: api-gateway-service
    restart: unless-stopped
    ports:
      - "8089:8089"
    environment:
      JAVA_OPTS: "-Xms96m -Xmx130m -XX:+UseG1GC -Djava.security.egd=file:/dev/./urandom"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888/
      SPRING_DATA_REDIS_HOST: redis-dev
      SPRING_DATA_REDIS_PORT: 6379
      CASDOOR_ISSUER_URI: http://localhost:8000
      CASDOOR_JWK_SET_URI: http://casdoor-dev:8000/.well-known/jwks
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8000
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://casdoor-dev:8000/.well-known/jwks
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "5"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
    env_file:
      - path: ./api-gateway-service/.env
        required: false
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8089/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      config-server:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 192M

  # ==========================================
  # 5. BUSINESS SERVICES (GRAALVM NATIVE)
  # ==========================================
  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: account-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888/
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-dev:5432/accounts
      DATABASE_URL: r2dbc:postgresql://postgres-dev:5432/accounts
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-dev:5432/accounts
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka-dev:29092
      CASDOOR_ISSUER_URI: http://localhost:8000
      CASDOOR_JWK_SET_URI: http://casdoor-dev:8000/.well-known/jwks
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8000
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://casdoor-dev:8000/.well-known/jwks
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "5"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
    env_file:
      - path: ./account-service/.env
        required: false
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      api-gateway-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888/
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka-dev:29092
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "5"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
    env_file:
      - path: ./notification-service/.env
        required: false
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      api-gateway-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    container_name: transaction-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888/
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-dev:5432/accounts
      DATABASE_URL: r2dbc:postgresql://postgres-dev:5432/accounts
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-dev:5432/accounts
      SPRING_DATA_REDIS_HOST: redis-dev
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka-dev:29092
      CASDOOR_ISSUER_URI: http://localhost:8000
      CASDOOR_JWK_SET_URI: http://casdoor-dev:8000/.well-known/jwks
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8000
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://casdoor-dev:8000/.well-known/jwks
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "5"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
    env_file:
      - path: ./transaction-service/.env
        required: false
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      api-gateway-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  fraud-detection-service:
    build:
      context: ./fraud-detection-service
      dockerfile: Dockerfile
    container_name: fraud-detection-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888/
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka-dev:29092
      SPRING_DATA_REDIS_HOST: redis-dev
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "5"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
    env_file:
      - path: ./fraud-detection-service/.env
        required: false
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8085/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      api-gateway-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: payment-service
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      CONFIG_SERVER_URL: http://config-server:8888/
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres-dev:5432/accounts
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-dev:5432/accounts
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka-dev:29092
      EUREKA_INSTANCE_LEASE_RENEWAL_INTERVAL_IN_SECONDS: "5"
      EUREKA_CLIENT_REGISTRY_FETCH_INTERVAL_SECONDS: "5"
    env_file:
      - path: ./payment-service/.env
        required: false
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8086/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      api-gateway-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  casdoor_data:
