spring:
  application:
    name: payment-service
  main:
    web-application-type: REACTIVE
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: CONFIG-SERVER

eureka:
  client:
    refresh:
      enable: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}